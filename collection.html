<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RARO — Collection</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

background:#050505;
font-family:Arial,sans-serif;
overflow-x:hidden;

}

/* HEADER */

.header{

height:100vh;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

text-align:center;

padding:30px;

}

.header h1{

color:#b08d57;

font-size:clamp(50px,8vw,90px);

font-weight:300;

letter-spacing:12px;

margin-bottom:25px;

}

.header p{

color:#d4c2a1;

font-size:18px;

line-height:1.8;

}

/* SECTIONS */

.concept{

position:relative;

height:100vh;

display:flex;

justify-content:center;
align-items:center;

text-align:center;

overflow:hidden;

text-decoration:none;

}

.content{

position:relative;

z-index:2;

}

.number{

font-size:12px;

letter-spacing:6px;

margin-bottom:20px;

opacity:.7;

}

.name{

font-size:clamp(50px,8vw,90px);

font-weight:300;

letter-spacing:10px;

margin-bottom:15px;

}

.meaning{

font-size:18px;

letter-spacing:4px;

margin-bottom:25px;

}

.quote{

font-size:20px;

max-width:500px;

line-height:1.8;

padding:0 25px;

}

.symbol{

position:absolute;

font-size:220px;

font-weight:100;

opacity:.05;

z-index:1;

line-height:1.1;

transition:.4s;

}

.concept:hover .symbol{

opacity:.12;

transform:scale(1.05);

}

/* VOID */

.void{

background:#050505;

color:#b08d57;

}

.void::before{

content:"";

position:absolute;

width:500px;
height:500px;

background:radial-gradient(circle,
rgba(176,141,87,.15),
transparent 70%);

filter:blur(80px);

}

/* ROOTS */

.roots{

background:#050505;

color:#7e8a68;

}

.roots::before{

content:"";

position:absolute;

width:500px;
height:500px;

background:radial-gradient(circle,
rgba(126,138,104,.15),
transparent 70%);

filter:blur(80px);

}

</style>

</head>

<body>

<section class="header">

<h1>THE COLLECTION</h1>

<p>
Six concepts.<br>
One archive.
</p>

</section>

<a href="void.html" class="concept void">

<div class="symbol">
○<br>•
</div>

<div class="content">

<div class="number">01</div>

<div class="name">VOID</div>

<div class="meaning">BEGINNING</div>

<div class="quote">
Nothing. Yet. Everything.
</div>

</div>

</a>

<a href="roots.html" class="concept roots">

<div class="symbol">
│<br>
/│\<br>
/ │ \
</div>

<div class="content">

<div class="number">02</div>

<div class="name">ROOTS</div>

<div class="meaning">ORIGIN</div>

<div class="quote">
Every origin shapes the path ahead.
</div>

</div>

</a>

</body>

</html>
