<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RARO — ATHAR</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#050505;

font-family:Arial,sans-serif;

overflow:hidden;

}

/* HERO */

.hero{

height:100vh;

display:flex;

justify-content:center;
align-items:center;

text-align:center;

position:relative;

overflow:hidden;

}

/* TRACE */

.trace{

position:absolute;

font-size:180px;

line-height:1.2;

color:#D8CCB5;

opacity:.06;

animation:drift 12s ease-in-out infinite;

user-select:none;

}

@keyframes drift{

0%{
transform:translate(-20px,-10px);
opacity:.04;
}

50%{
transform:translate(20px,10px);
opacity:.08;
}

100%{
transform:translate(-20px,-10px);
opacity:.04;
}

}

.content{

position:relative;

z-index:2;

color:#D8CCB5;

}

.number{

font-size:12px;

letter-spacing:8px;

margin-bottom:40px;

opacity:.8;

}

.name{

font-size:clamp(60px,10vw,120px);

font-weight:300;

letter-spacing:14px;

margin-bottom:20px;

}

.meaning{

font-size:18px;

letter-spacing:6px;

margin-bottom:30px;

color:#E6DCCB;

}

.quote{

font-size:20px;

line-height:1.8;

color:#CFC2AB;

}

</style>

</head>

<body>

<section class="hero">

<div class="trace">

•
<br>
&nbsp;&nbsp;\

<br>
&nbsp;&nbsp;&nbsp;&nbsp;\

<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;•

</div>

<div class="content">

<div class="number">05</div>

<div class="name">ATHAR</div>

<div class="meaning">TRACE</div>

<div class="quote">

Every passage leaves<br>
something behind.

</div>

</div>

</section>

</body>

</html>
