<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RARO — Join The Archive</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
font-family:Arial,sans-serif;
color:#b08d57;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:80px 30px;
}

.container{
width:100%;
max-width:520px;
text-align:center;
}

.raro-mark{
width:90px;
display:block;
margin:0 auto 40px;
}

.logo{
font-size:56px;
font-weight:300;
letter-spacing:12px;
margin-bottom:20px;
}

.subtitle{
font-size:14px;
letter-spacing:8px;
margin-bottom:50px;
}

.description{
max-width:420px;
margin:0 auto 70px;
color:#d8d0c5;
line-height:2;
font-size:18px;
}

.form-group{
margin-bottom:30px;
}

input{
width:100%;
background:transparent;
border:none;
border-bottom:1px solid rgba(176,141,87,.35);
padding:16px 0;
font-size:16px;
color:#d8d0c5;
outline:none;
}

input::placeholder{
color:rgba(216,208,197,.45);
}

button{
margin-top:30px;
background:transparent;
border:1px solid #b08d57;
color:#b08d57;
padding:18px 50px;
letter-spacing:4px;
font-size:13px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#b08d57;
color:#050505;
}

</style>

</head>

<body>

<div class="container">

<img
src="RARO_MASTER/02_MASTER_ASSETS/00B72C45-AAB4-4D9D-A816-0C7C8D6F47F0.jpeg"
alt="RARO Mark"
class="raro-mark">

<div class="logo">
RARO
</div>

<div class="subtitle">
JOIN THE ARCHIVE
</div>

<div class="description">
A place within the Archive is reserved for those who arrive before the release.
</div>
<form id="waitlist-form">

<div class="form-group">
<input type="text" name="name" placeholder="Name" required>
</div>

<div class="form-group">
<input type="tel" name="phone" placeholder="Phone Number" required>
</div>

<div class="form-group">
<input type="text" name="governorate" placeholder="Governorate" required>
</div>

<div class="form-group">
<input type="text" name="instagram" placeholder="Instagram (Optional)">
</div>

<button type="submit">
REQUEST ACCESS
</button>

</form>


</div>

</body>
</html
