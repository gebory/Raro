<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RARO — DIJLA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#050505;

font-family:Arial,sans-serif;

overflow:hidden;

}

/* HERO */

.hero{

height:100vh;

display:flex;

justify-content:center;
align-items:center;

text-align:center;

position:relative;

overflow:hidden;

}

/* FLOW */

.flow{

position:absolute;

font-size:240px;

letter-spacing:20px;

color:#E8E3D7;

opacity:.06;

animation:flowMove 10s ease-in-out infinite;

user-select:none;

white-space:nowrap;

}

@keyframes flowMove{

0%{
transform:translateX(-40px);
opacity:.04;
}

50%{
transform:translateX(40px);
opacity:.08;
}

100%{
transform:translateX(-40px);
opacity:.04;
}

}

.content{

position:relative;

z-index:2;

color:#E8E3D7;

}

.number{

font-size:12px;

letter-spacing:8px;

margin-bottom:40px;

opacity:.8;

}

.name{

font-size:clamp(60px,10vw,120px);

font-weight:300;

letter-spacing:14px;

margin-bottom:20px;

}

.meaning{

font-size:18px;

letter-spacing:6px;

margin-bottom:30px;

color:#F1ECE0;

}

.quote{

font-size:20px;

line-height:1.8;

color:#D7D0C2;

}

</style>

</head>

<body>

<section class="hero">

<div class="flow">

≈ ≈ ≈ ≈ ≈

</div>

<div class="content">

<div class="number">04</div>

<div class="name">DIJLA</div>

<div class="meaning">FLOW</div>

<div class="quote">

Movement never asks<br>
for permission.

</div>

</div>

</section>

</body>

</html>
