<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RARO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#111111;
color:#F3F0EA;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.logo{
font-size:5rem;
letter-spacing:12px;
}

.tagline{
margin-top:20px;
letter-spacing:4px;
color:#999;
}

.button{
margin-top:40px;
padding:15px 40px;
border:1px solid #F3F0EA;
text-decoration:none;
color:white;
}

.section{
padding:120px 10%;
}

.section h2{
font-size:3rem;
margin-bottom:30px;
}

.product{
margin-bottom:120px;
}

.product img{
width:100%;
border-radius:10px;
}

.product h3{
margin-top:20px;
font-size:2rem;
}

.footer{
padding:80px;
text-align:center;
border-top:1px solid #333;
}

</style>
</head>

<body>

<section class="hero">

<h1 class="logo">RARO</h1>

<p class="tagline">
DESIGNED TO REMAIN RARE
</p>

<a href="#drop" class="button">
ENTER DROP 01
</a>

</section>

<section id="drop" class="section">

<h2>DROP 01 — ATHAR</h2>

<div class="product">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">

<h3>ATHAR</h3>

<p>
40 Pieces Only.
Never Restocked.
</p>

</div>

<div class="product">

<img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c">

<h3>DIJLA</h3>

<p>
Inspired By Movement.
</p>

</div>

</section>

<section class="section">

<h2>WHY RARO?</h2>

<p>

Because not everything
should be mass produced.

</p>

</section>

<section class="section">

<h2>JOIN WAITLIST</h2>

<form>

<input
type="email"
placeholder="Email"
style="
width:100%;
padding:20px;
margin-top:20px;
">

</form>

</section>

<footer class="footer">

RARO © 2026

</footer>

</body>
</html>
