<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RARO — Join The Archive</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#050505;
color:#b08d57;
font-family:Arial,sans-serif;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:60px 30px;

}

.container{

width:100%;
max-width:520px;

text-align:center;

}

.mark-container{

margin-bottom:35px;

}

.raro-mark{

width:72px;
height:auto;

display:block;
margin:0 auto;

opacity:.95;

}

.logo{

font-size:clamp(54px,10vw,88px);

font-weight:300;

letter-spacing:12px;

margin-bottom:25px;

color:#b08d57;

}

.subtitle{

font-size:14px;

letter-spacing:10px;

margin-bottom:50px;

color:#b08d57;

}

.description{

max-width:500px;

margin:0 auto 70px;

line-height:2;

font-size:20px;

color:#d8d0c5;

}

form{

width:100%;

}

input{

width:100%;

background:transparent;

border:none;

border-bottom:1px solid rgba(176,141,87,.35);

padding:20px 0;

margin-bottom:30px;

color:#d8d0c5;

font-size:18px;

outline:none;

}

input::placeholder{

color:#7e7568;

}

button{

width:100%;

padding:22px;

margin-top:20px;

background:transparent;

border:1px solid #b08d57;

color:#b08d57;

font-size:13px;

letter-spacing:6px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#b08d57;

color:#050505;

}

@media(max-width:768px){

.logo{

font-size:72px;

letter-spacing:10px;

}

.description{

font-size:18px;

line-height:1.9;

margin-bottom:60px;

}

input{

font-size:17px;


}

</style>

</head>

<body>

<div class="container">

<div class="mark-container">

<img
src="RARO_MASTER/02_MASTER_ASSETS/00B72C45-AAB4-4D9D-A816-0C7C8D6F47F0.jpeg"
alt="RARO Mark"
class="raro-mark">

</div>

<div class="logo">
RARO
</div>

<div class="subtitle">
JOIN THE ARCHIVE
</div>

<div class="description">

A place within the Archive is reserved
for those who arrive before the release.

</div>
  
<form id="waitlist-form">
 

<input
type="text"
name="name"
placeholder="Name"
required>

<input
type="tel"
name="phone"
placeholder="Phone Number"
required>

<input
type="text"
name="governorate"
placeholder="Governorate"
required>

<input
type="text"
name="instagram"
placeholder="Instagram (Optional)">

<button type="submit">

REQUEST ACCESS

</button>

</form>

</div>
<script>

const form = document.getElementById('waitlist-form');

form.addEventListener('submit', async (e) => {

e.preventDefault();

const data = new FormData(form);

const response = await fetch(
'https://formspree.io/f/xbdedajg',
{
method: 'POST',
body: data,
headers:{
'Accept':'application/json'
}
}
);

if(response.ok){

window.location.href='thankyou.html';

}else{

alert('Submission failed. Please try again.');

}

});

</script>
</body>

</html>
