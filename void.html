<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RARO — VOID</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#050505;

font-family:Arial,sans-serif;

overflow-x:hidden;

}

/* HERO */

.hero{

height:100vh;

display:flex;

justify-content:center;
align-items:center;

text-align:center;

position:relative;

overflow:hidden;

}

/* VOID SYMBOL */

.symbol{

position:absolute;

font-size:380px;

transform:translateY(-40px);

line-height:.8;

color:#b08d57;

opacity:.05;
}

@keyframes breathe{

0%{
transform:scale(1);
opacity:.04;
}

50%{
transform:scale(1.06);
opacity:.08;
}

100%{
transform:scale(1);
opacity:.04;
}

}

.content{

position:relative;

z-index:2;

color:#b08d57;

}

.number{

font-size:12px;

letter-spacing:8px;

margin-bottom:35px;

opacity:.7;

}

.name{

font-size:clamp(60px,10vw,120px);

font-weight:300;

letter-spacing:14px;

margin-bottom:20px;

}

.meaning{

font-size:18px;

letter-spacing:6px;

margin-bottom:30px;

color:#d4c2a1;

}

.quote{

font-size:18px;

line-height:1.8;

color:#b08d57;

}

</style>

</head>

<body>

<section class="hero">

<div class="symbol">

○
<br>
•

</div>

<div class="content">

<div class="number">01</div>

<div class="name">VOID</div>

<div class="meaning">BEGINNING</div>

<div class="quote">

Nothing.<br>
Yet.<br>
Everything.

</div>

</div>

</section>

</body>

</html>
